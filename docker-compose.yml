services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courts
      POSTGRES_PASSWORD: courts
      POSTGRES_DB: courts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courts -d courts"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
