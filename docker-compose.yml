services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: courts
      POSTGRES_PASSWORD: courts
      POSTGRES_DB: courts
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courts -d courts"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      DATABASE_URL: postgres://courts:courts@db:5432/courts
      JWT_SECRET: change-me-in-production
      FACILITY_TIMEZONE: Europe/Madrid
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  # Not started by `docker compose up`. Run the backend test suite with:
  #   docker compose run --rm backend-test
  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: build
    command: ["npm", "test"]
    environment:
      TEST_DATABASE_URL: postgres://courts:courts@db:5432/courts_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
