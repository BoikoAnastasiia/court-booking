server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser talks only to nginx, which proxies to the backend.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback so deep links like /my-bookings work on refresh.
  location / {
    try_files $uri /index.html;
  }
}
