server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser talks only to nginx, which proxies to the backend.
  location /api/ {
    # nginx's default body limit is 1 MB; avatars may be up to 5 MB (validated
    # by the API), plus multipart overhead.
    client_max_body_size 6m;
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # WebSocket endpoint (more specific prefix, so it wins over /api/): forward
  # the Upgrade handshake and keep idle connections open (the API pings every 30s).
  location /api/ws {
    proxy_pass http://backend:4000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 1h;
  }

  # SPA fallback so deep links like /my-bookings work on refresh.
  location / {
    try_files $uri /index.html;
  }
}
